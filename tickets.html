<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NMDC CS&amp;IT Portal Service Desk Ticket Management for NMDC Limited, Bacheli Complex.">
  <title>Service Desk Tickets — NMDC Limited, Bacheli Complex</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body class="portal-body">
  <div class="portal-layout">
    <aside class="portal-sidebar" id="portalSidebar">
      <div class="portal-sidebar-brand">
        <div class="flex items-center gap-3">
          <div class="logomark" style="width:38px;height:38px;font-size:0.95rem;" title="NMDC Limited, Bacheli Complex">NC</div>
          <div>
            <div class="brand-title">CS&amp;IT Portal</div>
            <div class="brand-sub">Bacheli Regional Office</div>
          </div>
        </div>
      </div>
      <nav class="portal-nav" aria-label="Portal navigation">
        <a href="portal.html" class="portal-nav-link" data-page="dashboard"><span class="portal-nav-icon">&#128202;</span> Dashboard</a>
        <a href="documents.html" class="portal-nav-link" data-page="documents"><span class="portal-nav-icon">&#128196;</span> Documents</a>
        <a href="assets.html" class="portal-nav-link" data-page="assets"><span class="portal-nav-icon">&#128421;</span> Assets</a>
        <a href="tickets.html" class="portal-nav-link active" data-page="tickets"><span class="portal-nav-icon">&#127903;</span> Tickets</a>
        <a href="audit-logs.html" class="portal-nav-link" data-page="audit"><span class="portal-nav-icon">&#128203;</span> Audit Logs</a>
      </nav>
      <div class="portal-sidebar-footer">
        <a href="index.html" class="portal-back-link"><span>&larr;</span> Back to Main Website</a>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="togglePortalSidebar()"></div>

    <div class="portal-main">
      <header class="portal-header">
        <div class="portal-header-left">
          <button class="portal-menu-toggle" onclick="togglePortalSidebar()" aria-label="Toggle sidebar">&#9776;</button>
          <div class="portal-welcome" id="portalWelcome">
            <div class="welcome-text">Welcome, <span id="userName">User</span></div>
            <div class="role-text">Role: <span id="userRole">-</span> <span class="role-badge" id="roleBadge"></span></div>
          </div>
        </div>
        <div class="portal-header-right">
          <div id="notifBell"></div>
          <button class="btn-logout" onclick="portalLogout()">Logout</button>
        </div>
      </header>

      <main class="portal-content">
        <div class="portal-page-title">
          <h1>Ticket Management</h1>
          <p>Track and manage CS&amp;IT service requests and incidents</p>
        </div>

        <div class="docs-toolbar">
          <div class="docs-search-wrap">
            <span class="docs-search-icon">&#128269;</span>
            <input type="search" id="ticketSearch" placeholder="Search by ticket ID, title, assignee, or priority..." aria-label="Search tickets">
          </div>
          <button class="btn-primary" id="createTicketBtn">+ Create Ticket</button>
        </div>

        <div class="docs-filters" id="ticketFilters">
          <button class="filter-chip active" data-filter="all">All Tickets</button>
          <button class="filter-chip" data-filter="Open">Open</button>
          <button class="filter-chip" data-filter="Assigned">Assigned</button>
          <button class="filter-chip" data-filter="In Progress">In Progress</button>
          <button class="filter-chip" data-filter="Resolved">Resolved</button>
          <button class="filter-chip" data-filter="Closed">Closed</button>
          <button class="filter-chip" data-filter="Critical">Critical</button>
        </div>

        <div class="docs-table-wrap">
          <div class="docs-table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Ticket ID</th>
                  <th>Title</th>
                  <th>Priority</th>
                  <th>Assigned To</th>
                  <th>Status</th>
                  <th>Created Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="ticketTableBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="ticketModal">
    <div class="modal-dialog modal-lg">
      <div class="modal-header">
        <h2 id="ticketModalTitle">Create Ticket</h2>
        <button class="modal-close" id="ticketModalClose" aria-label="Close">&times;</button>
      </div>
      <form id="ticketForm">
        <div class="modal-body">
          <div class="form-group">
            <label for="ticketTitle">Title</label>
            <input type="text" id="ticketTitle" class="form-input" placeholder="Enter ticket title" required>
          </div>
          <div class="grid md:grid-cols-2 gap-4">
            <div class="form-group">
              <label for="ticketPriority">Priority</label>
              <select id="ticketPriority" class="form-select">
                <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
              </select>
            </div>
            <div class="form-group">
              <label for="ticketStatus">Status</label>
              <select id="ticketStatus" class="form-select">
                <option>Open</option><option>Assigned</option><option>In Progress</option><option>Resolved</option><option>Closed</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="ticketAssignedTo">Assigned To</label>
            <input type="text" id="ticketAssignedTo" class="form-input" placeholder="e.g. Helpdesk Team" required>
          </div>
          <div class="form-group">
            <label for="ticketDescription">Description</label>
            <textarea id="ticketDescription" class="form-textarea" placeholder="Describe the request or incident"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="ticketFormCancel">Cancel</button>
          <button type="submit" class="btn-primary" id="ticketFormSubmit">Create Ticket</button>
        </div>
      </form>
    </div>
  </div>

  <script src="shared.js"></script>
</body>
</html>
