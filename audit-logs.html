<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NMDC CS&amp;IT Portal Audit and System Logs for NMDC Limited, Bacheli Complex.">
  <title>System Audit Logs — NMDC Limited, Bacheli Complex</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body class="portal-body">
  <div class="portal-layout">
    <aside class="portal-sidebar" id="portalSidebar">
      <div class="portal-sidebar-brand">
        <div class="flex items-center gap-3">
          <div class="logomark" style="width:38px;height:38px;font-size:0.95rem;" title="NMDC Limited, Bacheli Complex">NC</div>
          <div>
            <div class="brand-title">CS&amp;IT Portal</div>
            <div class="brand-sub">Bacheli Regional Office</div>
          </div>
        </div>
      </div>
      <nav class="portal-nav" aria-label="Portal navigation">
        <a href="portal.html" class="portal-nav-link" data-page="dashboard"><span class="portal-nav-icon">&#128202;</span> Dashboard</a>
        <a href="documents.html" class="portal-nav-link" data-page="documents"><span class="portal-nav-icon">&#128196;</span> Documents</a>
        <a href="assets.html" class="portal-nav-link" data-page="assets"><span class="portal-nav-icon">&#128421;</span> Assets</a>
        <a href="tickets.html" class="portal-nav-link" data-page="tickets"><span class="portal-nav-icon">&#127903;</span> Tickets</a>
        <a href="audit-logs.html" class="portal-nav-link active" data-page="audit"><span class="portal-nav-icon">&#128203;</span> Audit Logs</a>
      </nav>
      <div class="portal-sidebar-footer">
        <a href="index.html" class="portal-back-link"><span>&larr;</span> Back to Main Website</a>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="togglePortalSidebar()"></div>

    <div class="portal-main">
      <header class="portal-header">
        <div class="portal-header-left">
          <button class="portal-menu-toggle" onclick="togglePortalSidebar()" aria-label="Toggle sidebar">&#9776;</button>
          <div class="portal-welcome" id="portalWelcome">
            <div class="welcome-text">Welcome, <span id="userName">User</span></div>
            <div class="role-text">Role: <span id="userRole">-</span> <span class="role-badge" id="roleBadge"></span></div>
          </div>
        </div>
        <div class="portal-header-right">
          <div id="notifBell"></div>
          <button class="btn-logout" onclick="portalLogout()">Logout</button>
        </div>
      </header>

      <main class="portal-content">
        <div class="portal-page-title">
          <h1>Audit Logs</h1>
          <p>Review user and system activity across portal modules</p>
        </div>

        <div class="docs-toolbar">
          <div class="docs-search-wrap">
            <span class="docs-search-icon">&#128269;</span>
            <input type="search" id="auditSearch" placeholder="Search by user, action, module, or description..." aria-label="Search audit logs">
          </div>
        </div>

        <div class="docs-filters" id="auditFilters">
          <button class="filter-chip active" data-filter="all">All Activity</button>
          <button class="filter-chip" data-filter="Authentication">Authentication</button>
          <button class="filter-chip" data-filter="Documents">Documents</button>
          <button class="filter-chip" data-filter="Assets">Assets</button>
          <button class="filter-chip" data-filter="Tickets">Tickets</button>
        </div>

        <div class="docs-table-wrap">
          <div class="docs-table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Timestamp</th>
                  <th>User</th>
                  <th>Action</th>
                  <th>Module</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody id="auditTableBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="shared.js"></script>
</body>
</html>
